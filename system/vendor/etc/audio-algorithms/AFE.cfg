            "Noise Dependent Volume Control":
                {
                "bypass"        : true,
                //
                // "mode" selects between four different modes of operation for the NDVC feature.
                // Each mode selects a different noise level as the "reference" for volume adaptation:
                // 0: Initial noise level (noise floor estimate when feature starts at runtime)
                // 1: Nominal quiet level ("nominalQuietLevel" parameter below)
                // 2: Noise level at the time the user changes volume
                // 3: Volume-dependent threshold, which requires specifying
                //    nominal volume, threshold factor and sensitivity rolloff below
                //
                "mode"               : 3,
                //
                // Parameters used only when "mode" is set to volume-dependent threshold
                //
                "nominalVolume"      : 30, // in 0-100 range
                "threshOffsetFactor" : 0.5,
                "sensitivityRolloff" : 1.0,
                //
                // Noise tracking parameters
                //
                "attackTime"         : 10.0, // sec
                "releaseTime"        : 0.01, // sec
                "shortAttackTime"    : 2.5, // sec
                "attackHoldTime"     : 2.5, // sec
                "attackTimeTTS"      : 2.66, // sec
                "releaseTimeTTS"     : 0.1, // sec
                "shortAttackTimeTTS" : 1.0, // sec
                "attackHoldTimeTTS"  : 1.0, // sec
                "minNoiseFreq"       : 375.0, // Hz
                "maxNoiseFreq"       : 8000.0, // Hz
                "centroidThreshHigh" : 0.4,
                "centroidThreshLow"  : 0.2,
